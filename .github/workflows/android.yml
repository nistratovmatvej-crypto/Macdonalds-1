name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.7
      - name: Prepare offline website assets
        run: |
          mkdir -p app/src/main/assets/site
          cp -R index.html menu.html product.html about.html locations.html careers.html app.html contacts.html css js app/src/main/assets/site/
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mcdonalds-2026-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
